<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Maintainable Application Server</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main>
    <p class="eyebrow">Java · sequential HTTP framework</p>
    <h1>Maintainable Application Server</h1>
    <p>Static resources and application endpoints share a small, explicit server framework.</p>
    <img src="/images/logo.png" alt="Framework logo served as a binary static resource" width="200" height="100">
    <section>
      <h2>Greeting service</h2>
      <form id="greeting-form">
        <label for="name">Name</label>
        <input id="name" name="name" placeholder="Ada" autocomplete="name">
        <button type="submit">Call /hello</button>
      </form>
    </section>
    <section><h2>Pi service</h2><button id="pi-button" type="button">Call /pi</button></section>
    <output id="result" aria-live="polite">Choose a service to see its response.</output>
  </main>
  <script src="/app.js"></script>
</body>
</html>
